# E2E 스택 전체(FE 소유 단일 파일): db + oidc-stub + backend + e2e(테스트 러너).
# 기동 순서·health 대기·네트워크·볼륨을 전부 여기 선언으로 조율한다(스크립트 대기 루프 없음).
# 진입점은 scripts/e2e-docker.sh(`pnpm test`) — `docker compose run e2e`만 한다.
#
# 과거엔 백엔드 레포의 docker-compose-local-full.yml에 override를 -f 2개로 얹었지만,
# 상대경로가 첫 -f 파일 기준으로 풀리는 함정(FE 파일 마운트 불가)과 테스트 러너가 스택 밖
# (host.docker.internal 경유)에 있는 구조적 비용이 컸다. 백엔드와의 실질 계약은
# "mysql 8(+ngram 설정) + 백엔드 이미지"뿐이라 단일 파일로 vendoring했다.
name: csereal-e2e

services:
  db:
    image: mysql:8.0
    cap_add: [SYS_NICE]
    environment:
      MYSQL_DATABASE: csereal
      MYSQL_ROOT_PASSWORD: password
    ports:
      - '3306:3306' # 호스트 디버깅용(mysql -h127.0.0.1)
    volumes:
      - db:/var/lib/mysql
      # ngram_token_size=2 — 백엔드 FTS 검색이 의존(백엔드 레포 소유 설정을 그대로 마운트)
      - ${BACKEND_DIR:-../../../csereal-server}/db_config:/etc/mysql/conf.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 2s
      timeout: 5s
      retries: 60

  # 부팅 시 OIDC discovery 한 번만 응답하는 stub(oidc-stub.conf). 왜 필요한가: 백엔드
  # application.yaml이 local 프로파일에도 issuer-uri(id.snucse.org — 학내 전용)를 등록해
  # Spring이 부팅 시 discovery를 하는데, 학외·CI에선 타임아웃 → 크래시 루프. 테스트는
  # mock-login이라 discovery 결과를 안 쓰므로 도달 가능한 issuer로만 돌린다.
  # (근본 해결 = 백엔드 local 프로파일에서 OIDC 등록 제거 — 업스트림 PR 대상.)
  oidc-stub:
    image: nginx:1.27-alpine
    volumes:
      - ./oidc-stub.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    image: my_server_image:1.0 # 로컬 빌드 이미지(기존 태그 유지 — 재빌드 회피)
    build:
      # prebuilt JAR(build/libs)를 COPY하는 Dockerfile — JAR 빌드는 CLAUDE.md §백엔드 동기화
      context: ${BACKEND_DIR:-../../../csereal-server}
    environment:
      profile: local # 런타임 프로파일 — mock-login(@Profile("!prod")) 활성
      OIDC_CLIENT_SECRET_DEV: dummy
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/csereal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_IDSNUCSE_ISSUER_URI: http://oidc-stub:8081
    ports:
      - '8080:8080' # 호스트 디버깅용
    depends_on:
      db: { condition: service_healthy }
      oidc-stub: { condition: service_started }
    restart: on-failure
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/api/v2/research/lab?language=ko']
      interval: 5s
      timeout: 5s
      retries: 60 # 첫 부팅(mysql 초기화 + flyway 전체 마이그레이션)이 느릴 수 있어 여유
      start_period: 20s

  # 테스트 러너. 태그는 @playwright/test 버전과 일치(버전 올릴 때 함께 수정).
  # 컨테이너 고정 이유: 비주얼 baseline(*-linux.png)은 폰트 렌더 환경 종속 — 이 이미지가
  # 정본 렌더 환경(호스트 OS 무관 픽셀 동일). 앱 빌드·서빙·시드·테스트 전부 이 안에서 실행.
  e2e:
    image: mcr.microsoft.com/playwright:v1.57.0-jammy
    working_dir: /work
    entrypoint: ['bash', 'tests/setup/e2e-entry.sh']
    depends_on:
      backend: { condition: service_healthy } # 백엔드 준비를 compose가 보장
    environment:
      CI: 1 # 컨테이너 런 = 워커1·retries2·forbidOnly(playwright.config가 분기)
      E2E_BACKEND_URL: http://backend:8080
      E2E_DB_HOST: db
    volumes:
      - ../..:/work
      - node_modules:/work/node_modules # 호스트(macOS) 바이너리를 덮지 않게 격리
      - pnpm-store:/pnpm-store
    ports:
      - '43210:43210' # --ui 모드 전용(`run --service-ports`일 때만 공개됨)

volumes:
  db:
  node_modules:
    name: csereal-e2e-node-modules # 기존 볼륨 이름 유지(재설치 회피)
  pnpm-store:
