# 프론트엔드 E2E 부팅용 백엔드 compose 오버라이드 (FE 레포 소유).
#
# 베이스(csereal-server/docker-compose-local-full.yml)는 백엔드 레포 소유지만, 이 오버라이드는
# "E2E가 백엔드를 어떻게 띄우는가"라는 프론트 측 계약이라 FE 레포가 소유한다(upstream
# wafflestudio/csereal-server main에는 없음 → 여기로 vendoring).
#
# 사용(로컬·CI 동일):
#   docker compose \
#     -f ../csereal-server/docker-compose-local-full.yml \
#     -f tests/setup/backend/docker-compose-fe-test.yml up -d --build
#
# build.context는 베이스(local-full.yml)의 `context: .`(= csereal-server/)를 상속한다.
# 이 파일은 build.args(PROFILE=local)와 환경변수만 덧댄다.
services:
  my_server:
    build:
      args:
        PROFILE: local
    environment:
      # mock-login은 @Profile("!prod")이라 local 프로파일에서 활성(진짜 JSESSIONID 세션).
      - OIDC_CLIENT_SECRET_DEV=dummy
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/csereal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      # ── OIDC discovery를 로컬 stub으로 돌린다 ───────────────────────────
      # application.yaml의 provider.idsnucse.issuer-uri 때문에 Spring이 **기동 시**
      # /.well-known/openid-configuration을 호출한다(ClientRegistrations.fromIssuerLocation).
      # id.snucse.org는 학내 전용이라 학외(로컬·GitHub Actions)에선 connect timeout/RST →
      # ApplicationContext 실패 → 크래시 루프로 E2E가 통째로 막힌다(2026-08 실측: 로컬
      # RestartCount 28, CI e2e 잡 실패). 즉 **E2E가 학내 전용 외부 서비스에 부팅을 의존**했다.
      #
      # E2E는 mock-login(@Profile("!prod"))으로 세션을 받아 진짜 OAuth 흐름을 타지 않으므로
      # discovery 결과가 쓰이지 않는다. 그래서 issuer-uri만 아래 stub으로 돌린다.
      # (빈 문자열은 안 된다 — Spring이 "issuer cannot be empty"로 거부한다. env로는
      #  application.yaml의 키를 지울 수 없어 "도달 가능한 issuer"를 주는 것이 유일한 길.)
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_IDSNUCSE_ISSUER_URI=http://oidc-stub:8081
    depends_on:
      - oidc-stub

  # 기동 시 discovery 한 번만 응답하면 되는 최소 stub. 파일 마운트를 쓰지 않는 이유는
  # compose의 상대경로가 **첫 번째 -f 파일 기준**으로 풀려(= csereal-server-main/) 이 레포의
  # 파일을 가리킬 수 없기 때문. 설정을 entrypoint에서 만들어 self-contained로 둔다.
  oidc-stub:
    image: nginx:1.27-alpine
    container_name: csereal_oidc_stub
    networks:
      - my-network
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 8081;
          location = /.well-known/openid-configuration {
            default_type application/json;
            return 200 '{"issuer":"http://oidc-stub:8081","authorization_endpoint":"http://oidc-stub:8081/authorize","token_endpoint":"http://oidc-stub:8081/token","userinfo_endpoint":"http://oidc-stub:8081/userinfo","jwks_uri":"http://oidc-stub:8081/jwks","response_types_supported":["code"],"subject_types_supported":["public"],"id_token_signing_alg_values_supported":["RS256"]}';
          }
        }
        NGINX
        exec nginx -g 'daemon off;'
