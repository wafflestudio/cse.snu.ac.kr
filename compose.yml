# 로컬 백엔드 환경: db + oidc-stub + backend (pnpm backend:up/down). E2E 러너는
# scripts/e2e-docker.sh가 이 스택의 네트워크에 붙인다. 테스트 세팅(시딩)은 tests/setup/.
name: csereal-local

services:
  db:
    image: mysql:8.0
    cap_add: [SYS_NICE]
    environment:
      MYSQL_DATABASE: csereal
      MYSQL_ROOT_PASSWORD: password
    ports:
      - '3306:3306' # 호스트 디버깅용(mysql -h127.0.0.1)
    volumes:
      - db:/var/lib/mysql
      # ngram_token_size=2 — 백엔드 FTS 검색이 의존(백엔드 레포 소유 설정을 그대로 마운트)
      - ${BACKEND_DIR:-../csereal-server}/db_config:/etc/mysql/conf.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 2s
      timeout: 5s
      retries: 60

  # 부팅 시 OIDC discovery 한 번만 응답하는 stub. 왜 필요한가: 백엔드 application.yaml이
  # local 프로파일에도 issuer-uri(id.snucse.org — 학내 전용)를 등록해 Spring이 부팅 시
  # discovery를 하는데, 학외·CI에선 타임아웃 → 크래시 루프. 테스트는 mock-login이라
  # discovery 결과를 안 쓰므로 도달 가능한 issuer로만 돌린다. issuer 값은 요청 URI와
  # 정확히 일치해야 한다(Spring이 검증). (근본 해결 = 백엔드 local 프로파일에서 OIDC
  # 등록 제거 — 업스트림 PR 대상, 머지되면 이 서비스 삭제.)
  oidc-stub:
    image: nginx:1.27-alpine
    configs:
      - source: oidc_stub_conf
        target: /etc/nginx/conf.d/default.conf

  backend:
    image: my_server_image:1.0 # 로컬 빌드 이미지(기존 태그 유지 — 재빌드 회피)
    build:
      # prebuilt JAR(build/libs)를 COPY하는 Dockerfile — JAR 빌드는 CLAUDE.md §백엔드 동기화
      context: ${BACKEND_DIR:-../csereal-server}
    environment:
      profile: local # 런타임 프로파일 — mock-login(@Profile("!prod")) 활성
      OIDC_CLIENT_SECRET_DEV: dummy
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/csereal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_IDSNUCSE_ISSUER_URI: http://oidc-stub:8081
    ports:
      - '8080:8080' # 호스트 디버깅용
    depends_on:
      db: { condition: service_healthy }
      oidc-stub: { condition: service_started }
    restart: on-failure
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/api/v2/research/lab?language=ko']
      interval: 5s
      timeout: 5s
      retries: 60 # 첫 부팅(mysql 초기화 + flyway 전체 마이그레이션)이 느릴 수 있어 여유
      start_period: 20s

configs:
  oidc_stub_conf:
    content: |
      server {
        listen 8081;
        location = /.well-known/openid-configuration {
          default_type application/json;
          return 200 '{"issuer":"http://oidc-stub:8081","authorization_endpoint":"http://oidc-stub:8081/authorize","token_endpoint":"http://oidc-stub:8081/token","userinfo_endpoint":"http://oidc-stub:8081/userinfo","jwks_uri":"http://oidc-stub:8081/jwks","response_types_supported":["code"],"subject_types_supported":["public"],"id_token_signing_alg_values_supported":["RS256"]}';
        }
      }

volumes:
  db:
