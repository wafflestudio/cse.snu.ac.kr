# 로컬 백엔드 환경: db + backend (pnpm backend:up/down).
name: csereal-local

services:
  db:
    image: mysql:8.0
    cap_add: [SYS_NICE]
    environment:
      MYSQL_DATABASE: csereal
      MYSQL_ROOT_PASSWORD: password
    ports:
      - '3306:3306' # 호스트 디버깅용(mysql -h127.0.0.1)
    volumes:
      - db:/var/lib/mysql
      # ngram_token_size=2 — 백엔드 FTS 검색이 의존(백엔드 레포 소유 설정을 그대로 마운트)
      - ${BACKEND_DIR:-../csereal-server}/db_config:/etc/mysql/conf.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 2s
      timeout: 5s
      retries: 60

  search:
    image: csereal-search:local
    build:
      context: ${BACKEND_DIR:-../csereal-server}
      dockerfile: Dockerfile.es
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false' # 포트를 밖으로 안 내는 것이 방어다
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9200:9200' # 호스트 디버깅용
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS localhost:9200/_cluster/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40

  backend:
    image: csereal-backend:local
    build:
      context: ${BACKEND_DIR:-../csereal-server}
    environment:
      SPRING_PROFILES_ACTIVE: local # mock-login(@Profile("!prod")) 활성
      SPRING_ELASTICSEARCH_URIS: http://search:9200
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/csereal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - '8080:8080' # 호스트 디버깅용
    depends_on:
      db: { condition: service_healthy }
      search: { condition: service_healthy }
    restart: on-failure
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/api/v2/research/lab?language=ko']
      interval: 5s
      timeout: 5s
      retries: 60 # 첫 부팅(mysql 초기화 + flyway 전체 마이그레이션)이 느릴 수 있어 여유
      start_period: 20s

volumes:
  db:
