# PR 게이트. develop/main으로 가는 PR마다 실행 → 그린이어야 머지(branch protection: web-test·api-test).
# CI는 로컬 스크립트를 호출만 한다(두 벌 관리 X).
name: CI

on:
  pull_request:
    branches: [develop, main]
  # develop push 는 캐시를 채우기 위해 돈다. PR 브랜치가 만든 캐시는 다른 PR 이 못 읽고
  # 기본 브랜치가 만든 캐시만 모두가 읽는다(GitHub 캐시 격리 규칙).
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 백엔드 테스트 + E2E 가 쓸 bootJar. 캐시 키가 백엔드 소스의 내용 해시라 백엔드가 그대로면
  # Gradle 을 안 돈다. 캐시는 잡이 성공했을 때만 저장되므로 히트는 "이 내용으로 테스트가 통과했다"는 뜻.
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 실측 3분
    permissions:
      contents: read
      checks: write
      pull-requests: write
    outputs:
      jar-key: ${{ steps.jar.outputs.cache-primary-key }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        id: jar
        with:
          path: apps/api/build/libs
          key: api-jar-${{ hashFiles('apps/api/src/**', 'apps/api/build.gradle.kts', 'apps/api/settings.gradle.kts', 'apps/api/gradle/**') }}
      - if: steps.jar.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - if: steps.jar.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6
      # -x jar: plain jar 를 안 만든다 — bootJar 와 나란히 있으면 Dockerfile 의 COPY *-SNAPSHOT.jar 가 둘을 잡아 실패한다.
      - if: steps.jar.outputs.cache-hit != 'true'
        run: ./gradlew build -x jar
      - if: always() && steps.jar.outputs.cache-hit != 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: apps/api/build/test-results/**/*.xml

  # JS 워크스페이스 정적 검사 뒤 E2E. E2E 는 로컬과 같은 e2e/run.sh 를 핀된 컨테이너로 실행하고,
  # 백엔드 이미지는 api-test 가 만든 jar 로 만든다(JAR_STAGE=prebuilt → compose 빌드에서 Gradle 안 돈다).
  web-test:
    if: github.event_name == 'pull_request'
    needs: api-test
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 실측 7분(설치·정적 검사 1분 + E2E 6분)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # packageManager 필드에서 버전 읽음
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - uses: actions/cache/restore@v4
        with:
          path: apps/api/build/libs
          key: ${{ needs.api-test.outputs.jar-key }}
          fail-on-cache-miss: true
      - name: E2E (e2e/run.sh)
        env:
          JAR_STAGE: prebuilt
        run: pnpm e2e
