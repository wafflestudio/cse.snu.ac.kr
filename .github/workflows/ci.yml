# PR 게이트. develop/main으로 가는 PR마다 실행 → 그린이어야 머지(branch protection: gate·e2e).
# 핵심 원칙: CI는 로컬 스크립트를 "호출"만 한다(두 벌 관리 X). 같은 biome.json·tsconfig·
# e2e/run.sh·gradlew를 그대로 쓴다. 
name: CI

on:
  pull_request:
    branches: [develop, main]
  # develop push 는 캐시를 채우기 위해 돈다. PR 브랜치가 만든 캐시는 다른 PR 이 못 읽고
  # 기본 브랜치가 만든 캐시만 모두가 읽는다(GitHub 캐시 격리 규칙).
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'

  # 타입·린트·knip·빌드. 워크스페이스 전체.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # packageManager 필드에서 버전 읽음
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck # 모든 패키지
      - run: pnpm lint # biome check (pre-commit과 동일 기준)
      - run: pnpm knip # 미사용 파일·export·의존성

  # 백엔드 단위 테스트 
  api-test:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: apps/api/build/test-results/**/*.xml

  # E2E 가 붙을 백엔드 jar. 백엔드 소스 해시로 캐시해 백엔드가 그대로면 Gradle 을 안 돈다.
  api-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        id: jar
        with:
          path: apps/api/build/libs
          key: api-jar-${{ hashFiles('apps/api/src/**', 'apps/api/build.gradle.kts', 'apps/api/settings.gradle.kts', 'apps/api/gradle/**') }}
      - if: steps.jar.outputs.cache-hit != 'true'
        working-directory: apps/api
        run: JAVA_HOME=$JAVA_HOME_21_X64 ./gradlew --no-daemon bootJar -x test

  # E2E(비주얼 회귀 포함): 로컬과 "동일한" e2e/run.sh를 핀된 컨테이너로 실행한다.
  # 호스트엔 JDK도 pnpm/node도 불필요. 백엔드 이미지는 위에서 캐시한 jar 로 만든다
  # (JAR_STAGE=prebuilt → compose 빌드에서 Gradle 안 돈다).
  e2e:
    if: github.event_name == 'pull_request'
    needs: api-jar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v4
        with:
          path: apps/api/build/libs
          key: api-jar-${{ hashFiles('apps/api/src/**', 'apps/api/build.gradle.kts', 'apps/api/settings.gradle.kts', 'apps/api/gradle/**') }}
          fail-on-cache-miss: true
      - name: E2E (e2e/run.sh)
        env:
          JAR_STAGE: prebuilt
        run: bash e2e/run.sh
