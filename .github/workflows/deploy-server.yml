# 백엔드(apps/server)와 엣지(Caddy) 배포. main → production, develop → staging.
# 호스트가 이 레포를 클론해 apps/server 에서 ops/host-deploy.sh 를 돈다(빌드는 호스트).
# 프론트 배포는 deploy-web.yml.
name: Deploy server

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/server/**'
      - '.github/deploy-targets/**'
      - '.github/workflows/deploy-server.yml'

concurrency:
  group: deploy-server-${{ github.ref_name }}
  # 호스트에서 빌드·up 도는 중에 끊기면 중간 상태로 남는다.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      # 이후 스텝은 env.SSH_HOST 처럼 쓴다.
      - name: 배포 대상 설정 읽기
        run: grep -vE '^\s*(#|$)' .github/deploy-targets/${{ github.ref_name }}.env >> "$GITHUB_ENV"

      - name: 호스트에서 빌드·배포
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GIT_SHA: ${{ github.sha }}
        run: |
          install -m 600 /dev/stdin key <<<"$SSH_KEY"
          cat >remote.sh <<'REMOTE'
          set -e
          mkdir -p ~/proxy
          W=~/build/cse.snu.ac.kr
          [ -d "$W/.git" ] || git clone -q https://github.com/wafflestudio/cse.snu.ac.kr.git "$W"
          cd "$W"
          git fetch -q origin
          # 추적 파일만 맞춘다. build/ 와 .gradle/ 은 남겨야 증분 컴파일이 산다.
          git reset -q --hard "$GIT_SHA"
          cd apps/server
          bash ops/host-deploy.sh
          REMOTE

          # SNU 경계 장비가 학외에서 오는 연결을 간헐적으로 끊는다
          # (kex_exchange_identification: Connection reset — sshd 로그에는 남지도 않는다).
          # 배포 스크립트는 같은 커밋으로 여러 번 돌려도 결과가 같다.
          for attempt in 1 2 3 4 5; do
            if timeout 15m ssh -i key -p "$SSH_PORT" \
                -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
                "$SSH_USER@$SSH_HOST" \
                GIT_SHA="$GIT_SHA" PROFILE="$PROFILE" URL="$URL" \
                CADDYFILE="$CADDYFILE" CERTIFICATE="${CERTIFICATE:-}" PRIVATE_KEY="${PRIVATE_KEY:-}" \
                'bash -s' <remote.sh; then
              exit 0
            fi
            echo "::warning::SSH 실패 ($attempt/5) — 재시도"
            sleep 15
          done
          exit 1
