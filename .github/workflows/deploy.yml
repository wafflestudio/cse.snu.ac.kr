# 배포. develop push → staging, main push → production.
# 빌드는 호스트에서 한다(레지스트리 없음, "빌드 == 배포"). 이 잡은 SSH 로 호스트가 레포를 클론해
# infra/ops/host-deploy.sh 를 돌리게 트리거만 한다 — 백엔드·웹 이미지를 만들어 compose 스택으로 올리고 Caddy 를 reload 한다.
# 롤백은 revert 커밋을 올린다 — 같은 길로 나간다.
name: Deploy

on:
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false # 호스트에서 빌드·up 도는 중에 끊기면 중간 상태로 남는다

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7 # infra/*.env 를 읽기 위해서만(빌드는 호스트가 함)

      # 접속 정보만 여기서 읽는다. 나머지 설정은 호스트의 host-deploy.sh 가 클론 안의 같은 파일에서 읽는다.
      - name: 배포 대상 접속 정보
        run: grep -E '^SSH_' infra/${{ env.TARGET }}.env >> "$GITHUB_ENV"

      - name: 호스트에서 빌드·배포
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KAKAO: ${{ secrets.KAKAO_MAP_KEY }} # 웹 빌드의 카카오맵 키 — git 밖, build-arg 로 주입
          GIT_SHA: ${{ github.sha }}
        run: |
          install -m 600 /dev/stdin key <<< "$SSH_KEY"
          cat > remote.sh <<'REMOTE'
          set -e
          mkdir -p ~/proxy
          W=~/build/cse.snu.ac.kr
          [ -d "$W/.git" ] || git clone -q https://github.com/wafflestudio/cse.snu.ac.kr.git "$W"
          cd "$W"
          git fetch -q origin
          # 추적 파일만 맞춘다. build/ 와 .gradle/ 은 남겨야 증분 컴파일이 산다.
          git reset -q --hard "$GIT_SHA"
          bash infra/ops/host-deploy.sh
          REMOTE

          # SNU 경계 장비가 학외 연결을 간헐적으로 끊는다(kex_exchange_identification: Connection reset).
          # 배포 스크립트는 같은 커밋으로 여러 번 돌려도 결과가 같다.
          for attempt in 1 2 3 4 5; do
            if timeout 15m ssh -i key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
                "$SSH_USER@$SSH_HOST" \
                GIT_SHA="$GIT_SHA" TARGET="$TARGET" KAKAO="$KAKAO" 'bash -s' < remote.sh; then
              exit 0
            fi
            echo "::warning::SSH 실패 ($attempt/5) — 재시도"
            sleep 15
          done
          exit 1
