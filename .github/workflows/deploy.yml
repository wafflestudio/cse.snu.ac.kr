# develop push → staging 호스트에서 빌드+배포(자동). prod(main)는 `deploy.sh prod`로 수동.
# 이 잡은 SSH로 remote-deploy.sh를 보내 호스트 빌드를 트리거만 한다(빌드는 호스트, CI는 게이트만).
name: Deploy

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md'] # 문서만 바뀐 커밋은 재배포 안 함

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # 배포는 중간 취소 금지

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # remote-deploy.sh를 호스트로 보내기 위해서만 체크아웃(빌드는 호스트가 함)
      - name: staging 배포(SSH → 호스트에서 git URL 빌드 + 교체)
        env:
          # host/user/port는 비밀 아님(공개키 전용). 진짜 비밀은 둘: SSH 키, 카맵키(build-arg로 주입).
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KAKAO: ${{ secrets.KAKAO_MAP_KEY }}
          SSH_HOST: 168.107.16.249
          SSH_USER: ubuntu
          SSH_PORT: "22"
        run: |
          install -m 600 /dev/stdin key <<< "$SSH_KEY"
          # 학외(Actions)→호스트 연결이 가끔 SYN drop → 재시도. remote-deploy.sh는 build+swap이라 재실행 안전.
          OPTS="-i key -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            if ssh $OPTS "$SSH_USER@$SSH_HOST" \
                 "REF='${{ github.sha }}' BUILD_MODE=staging KAKAO='$KAKAO' bash -s" \
                 < scripts/remote-deploy.sh; then
              exit 0
            fi
            echo "::warning::staging 배포 SSH 시도 ${attempt}/3 실패, 재시도…"
            sleep 10
          done
          echo "::error::staging 배포 3회 모두 실패"; exit 1
