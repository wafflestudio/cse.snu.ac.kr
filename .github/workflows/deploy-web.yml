# 프론트(apps/web) 배포. develop → staging, main → production. 백엔드는 deploy-api.yml.
# 이 잡은 SSH로 deploy-web.sh를 보내 호스트 빌드(git URL → docker build → 컨테이너 교체)를 트리거만 한다.
# 롤백: Actions 에서 workflow_dispatch 로 이전 커밋 sha 를 ref 에 넣어 실행한다.
name: Deploy web

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'infra/ops/deploy-web.sh'
      - '.dockerignore'
      - 'infra/deploy-targets/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 커밋 sha (비우면 이 브랜치의 HEAD). 롤백용.
        required: false

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: false # 배포는 중간 취소 금지

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7 # deploy-web.sh 와 deploy-targets 를 읽기 위해서만(빌드는 호스트가 함)

      - name: 배포 대상 설정 읽기
        run: grep -vE '^\s*(#|$)' infra/deploy-targets/${{ github.ref_name }}.env >> "$GITHUB_ENV"

      - name: 호스트에서 빌드·교체
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KAKAO: ${{ secrets.KAKAO_MAP_KEY }} # 카맵키는 git 밖 — build-arg 로 주입
          REF: ${{ inputs.ref || github.sha }}
          BUILD_MODE: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          install -m 600 /dev/stdin key <<< "$SSH_KEY"
          # SNU 경계 장비가 학외 연결을 간헐적으로 끊는다(kex_exchange_identification: Connection reset).
          # deploy-web.sh 는 같은 커밋으로 여러 번 돌려도 결과가 같다.
          for attempt in 1 2 3 4 5; do
            if timeout 15m ssh -i key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
                "$SSH_USER@$SSH_HOST" \
                "REF='$REF' BUILD_MODE='$BUILD_MODE' KAKAO='$KAKAO' bash -s" \
                < infra/ops/deploy-web.sh; then
              exit 0
            fi
            echo "::warning::SSH 실패 ($attempt/5) — 재시도"
            sleep 15
          done
          exit 1
